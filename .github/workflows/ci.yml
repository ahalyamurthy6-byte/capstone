name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -m "not integration"

  eval-gate:
    runs-on: [self-hosted, linux]
    needs: unit
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Init database
        run: python -m scripts.init_db
      - name: Prepare claim packs
        run: python -m scripts.make_claim_packs
      - name: Seed database
        run: python -m db.seed
      - name: Start services
        run: ./scripts/run_servers.sh
      - name: Run eval gate
        run: python -m evals.run_eval --name ci --limit 8 --judge-sample 4
      - name: Verify gate
        run: pytest evals/test_gate.py
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
      - name: Stop services
        if: always()
        run: ./scripts/stop_servers.sh
